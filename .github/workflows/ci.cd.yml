name: Monorepo CI/CD Automation

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
    paths:
      - 'src/**'
      - '.github/workflows/ci.cd.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - '.github/workflows/ci.cd.yml'

jobs:
  test_matrix:
    name: Backend Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'src/backend/package-lock.json'

      - name: Install Backend Dependencies
        working-directory: src/backend
        run: npm ci

      - name: Run Backend Tests
        working-directory: src/backend
        run: npm test

  sonarqube_analysis:
    name: SonarQube Code Quality Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code (Full History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  build_containers:
    name: Verify Docker Container Builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v6
        with:
          context: src/backend
          push: false
          tags: monorepo-backend:test

      - name: Build Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: src/frontend
          push: false
          tags: monorepo-frontend:test

  simulate_deployment:
    name: Simulate Production Deployment
    runs-on: ubuntu-latest
    needs: [test_matrix, sonarqube_analysis, build_containers]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Simulating Deployment
        run: |
          echo "Deploying frontend from src/frontend/index.html..."
          echo "Deploying backend service..."
          echo "✅ Deployment simulation to staging completed successfully!"

  create_release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: simulate_deployment
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Automated Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
